<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e8f1ec"/>
    </linearGradient>
    <filter id="ds6" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b3d30" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="440" fill="url(#bg6)"/>

  <text x="600" y="48" fill="#1a1a1a" font-size="24" font-weight="bold" text-anchor="middle">六桩引脚悬案，一次全部结案</text>

  <!-- ===== 中央 ESP32 ===== -->
  <g transform="translate(600 230)" filter="url(#ds6)">
    <rect x="-95" y="-140" width="190" height="280" rx="13" fill="#0f3d2e" stroke="#0a2c21" stroke-width="4"/>
    <rect x="-60" y="-120" width="120" height="88" rx="8" fill="#c9ccd1" stroke="#9aa0a6" stroke-width="3"/>
    <text x="0" y="-82" fill="#4a5057" font-size="18" font-weight="bold" text-anchor="middle">ESP32</text>
    <text x="0" y="-58" fill="#6b7280" font-size="12" text-anchor="middle">GPIO 清算中…</text>
    <rect x="-75" y="62" width="38" height="20" rx="4" fill="#d9dee2" stroke="#9aa0a6" stroke-width="2"/>
    <text x="-56" y="76" fill="#4a5057" font-size="10" font-weight="bold" text-anchor="middle">BOOT</text>
    <rect x="37" y="62" width="38" height="20" rx="4" fill="#d9dee2" stroke="#9aa0a6" stroke-width="2"/>
    <text x="56" y="76" fill="#4a5057" font-size="10" font-weight="bold" text-anchor="middle">EN</text>
    <rect x="-24" y="112" width="48" height="24" rx="5" fill="#b8bcc2" stroke="#8a9099" stroke-width="3"/>
  </g>

  <!-- ===== 六桩案件卡片（环绕） ===== -->
  <!-- 案1 GPIO34 左上 -->
  <g transform="translate(60 85)">
    <rect width="300" height="88" rx="10" fill="#fff" stroke="#c0392b" stroke-width="3"/>
    <text x="14" y="28" fill="#c0392b" font-size="15" font-weight="bold">① GPIO34 亮不了灯</text>
    <text x="14" y="52" fill="#333" font-size="13">仅输入脚：内部没有驱动管</text>
    <text x="14" y="74" fill="#6b6b6b" font-size="12">→ 读模拟是宝，点灯永远没戏</text>
    <rect x="246" y="12" width="42" height="24" rx="12" fill="#0b6e4f"/>
    <text x="267" y="29" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">结案</text>
  </g>
  <!-- 案2 strapping 右上 -->
  <g transform="translate(840 85)">
    <rect width="300" height="88" rx="10" fill="#fff" stroke="#e67e22" stroke-width="3"/>
    <text x="14" y="28" fill="#e67e22" font-size="15" font-weight="bold">② strapping 开机抽签</text>
    <text x="14" y="52" fill="#333" font-size="13">IO0/2/5/12/15 上电瞬间采样</text>
    <text x="14" y="74" fill="#6b6b6b" font-size="12">→ IO12 被拉高 = 板子直接不启动</text>
    <rect x="246" y="12" width="42" height="24" rx="12" fill="#0b6e4f"/>
    <text x="267" y="29" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">结案</text>
  </g>
  <!-- 案3 浮空 左中 -->
  <g transform="translate(60 196)">
    <rect width="300" height="88" rx="10" fill="#fff" stroke="#8e44ad" stroke-width="3"/>
    <text x="14" y="28" fill="#8e44ad" font-size="15" font-weight="bold">③ INPUT 读数乱跳</text>
    <text x="14" y="52" fill="#333" font-size="13">浮空引脚 = 一根天线</text>
    <text x="14" y="74" fill="#6b6b6b" font-size="12">→ INPUT_PULLUP 把它锚在确定电平</text>
    <rect x="246" y="12" width="42" height="24" rx="12" fill="#0b6e4f"/>
    <text x="267" y="29" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">结案</text>
  </g>
  <!-- 案4 1.65V 右中 -->
  <g transform="translate(840 196)">
    <rect width="300" height="88" rx="10" fill="#fff" stroke="#2980b9" stroke-width="3"/>
    <text x="14" y="28" fill="#2980b9" font-size="15" font-weight="bold">④ 1.65V 楚河汉界</text>
    <text x="14" y="52" fill="#333" font-size="13">CMOS 判决中点，0.8–2.0V 是模糊区</text>
    <text x="14" y="74" fill="#6b6b6b" font-size="12">→ 信号别停在过渡区，要留裕量</text>
    <rect x="246" y="12" width="42" height="24" rx="12" fill="#0b6e4f"/>
    <text x="267" y="29" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">结案</text>
  </g>
  <!-- 案5 5V 左下 -->
  <g transform="translate(60 307)">
    <rect width="300" height="88" rx="10" fill="#fff" stroke="#c0392b" stroke-width="3"/>
    <text x="14" y="28" fill="#c0392b" font-size="15" font-weight="bold">⑤ 5V 设备直连危险</text>
    <text x="14" y="52" fill="#333" font-size="13">输入绝对最大值 ≈ VDD+0.3V ≈ 3.6V</text>
    <text x="14" y="74" fill="#6b6b6b" font-size="12">→ 必须电平转换，第一大烧片事故源</text>
    <rect x="246" y="12" width="42" height="24" rx="12" fill="#0b6e4f"/>
    <text x="267" y="29" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">结案</text>
  </g>
  <!-- 案6 ADC2 右下 -->
  <g transform="translate(840 307)">
    <rect width="300" height="88" rx="10" fill="#fff" stroke="#16a085" stroke-width="3"/>
    <text x="14" y="28" fill="#16a085" font-size="15" font-weight="bold">⑥ ADC2 与 Wi-Fi 争地盘</text>
    <text x="14" y="52" fill="#333" font-size="13">Wi-Fi 射频校准时征用 ADC2</text>
    <text x="14" y="74" fill="#6b6b6b" font-size="12">→ 模拟输入永远用 ADC1（32–39）</text>
    <rect x="246" y="12" width="42" height="24" rx="12" fill="#0b6e4f"/>
    <text x="267" y="29" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">结案</text>
  </g>

  <!-- 连接线（案件 → 板子） -->
  <g stroke="#b8c4bd" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <path d="M360 129 C 460 129, 480 160, 512 185"/>
    <path d="M840 129 C 740 129, 720 160, 688 185"/>
    <path d="M360 240 C 440 240, 470 235, 512 232"/>
    <path d="M840 240 C 760 240, 730 235, 688 232"/>
    <path d="M360 351 C 460 351, 480 310, 512 282"/>
    <path d="M840 351 C 740 351, 720 310, 688 282"/>
  </g>

  <!-- 底部标语 -->
  <text x="600" y="430" fill="#0b6e4f" font-size="16" font-weight="bold" text-anchor="middle">三连问：仅输入？strapping？要模拟？—— 问完再接，引脚安全你已是专家</text>
</svg>
