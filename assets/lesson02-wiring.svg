<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1100" height="700" fill="#fbfcfb"/>
  <text x="550" y="40" fill="#1a1a1a" font-size="26" font-weight="bold" text-anchor="middle">第 2 课接线图（照着接，先断电！）</text>

  <!-- ============ 左：ESP32 ============ -->
  <g transform="translate(60 90)">
    <rect width="230" height="540" rx="14" fill="#0f3d2e" stroke="#0a2c21" stroke-width="4"/>
    <!-- 模块 -->
    <rect x="40" y="36" width="150" height="112" rx="8" fill="#c9ccd1" stroke="#9aa0a6" stroke-width="3"/>
    <text x="115" y="84" fill="#4a5057" font-size="17" font-weight="bold" text-anchor="middle">ESP32</text>
    <text x="115" y="110" fill="#6b7280" font-size="12" text-anchor="middle">WROOM-32</text>
    <!-- USB -->
    <rect x="85" y="500" width="60" height="30" rx="5" fill="#b8bcc2" stroke="#8a9099" stroke-width="3"/>
    <!-- 三个用到的引脚（右侧突出） -->
    <!-- GPIO4 -->
    <g>
      <rect x="230" y="200" width="36" height="24" rx="4" fill="#e67e22"/>
      <text x="248" y="217" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">IO4</text>
      <text x="216" y="245" fill="#ffd24d" font-size="12" font-weight="bold" text-anchor="end">输出 → LED</text>
    </g>
    <!-- GPIO23 -->
    <g>
      <rect x="230" y="330" width="36" height="24" rx="4" fill="#0b6e4f"/>
      <text x="248" y="347" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">IO23</text>
      <text x="216" y="375" fill="#8fd6bd" font-size="12" font-weight="bold" text-anchor="end">输入 ← 按钮</text>
    </g>
    <!-- GND -->
    <g>
      <rect x="230" y="450" width="36" height="24" rx="4" fill="#4a5b66"/>
      <text x="248" y="467" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">GND</text>
    </g>
    <text x="115" y="580" fill="#0b6e4f" font-size="15" font-weight="bold" text-anchor="middle">ESP32 开发板</text>
  </g>

  <!-- ============ 右上：面包板 LED 回路 ============ -->
  <g transform="translate(430 90)">
    <!-- 面包板 -->
    <rect width="600" height="240" rx="10" fill="#f2f0ec" stroke="#c8c2b6" stroke-width="3"/>
    <text x="300" y="26" fill="#8a8378" font-size="14" font-weight="bold" text-anchor="middle">面包板</text>
    <!-- 孔阵 -->
    <g fill="#fff" stroke="#a9a294" stroke-width="1.5">
      <circle cx="70" cy="70" r="8"/><circle cx="130" cy="70" r="8"/><circle cx="190" cy="70" r="8"/><circle cx="250" cy="70" r="8"/><circle cx="310" cy="70" r="8"/><circle cx="370" cy="70" r="8"/><circle cx="430" cy="70" r="8"/><circle cx="490" cy="70" r="8"/>
      <circle cx="70" cy="130" r="8"/><circle cx="130" cy="130" r="8"/><circle cx="190" cy="130" r="8"/><circle cx="250" cy="130" r="8"/><circle cx="310" cy="130" r="8"/><circle cx="370" cy="130" r="8"/><circle cx="430" cy="130" r="8"/><circle cx="490" cy="130" r="8"/>
      <circle cx="70" cy="190" r="8"/><circle cx="130" cy="190" r="8"/><circle cx="190" cy="190" r="8"/><circle cx="250" cy="190" r="8"/><circle cx="310" cy="190" r="8"/><circle cx="370" cy="190" r="8"/><circle cx="430" cy="190" r="8"/><circle cx="490" cy="190" r="8"/>
    </g>
    <!-- 同组高亮（每 5 孔一组的概念简化：这里标两组） -->
    <rect x="100" y="52" width="230" height="36" rx="6" fill="none" stroke="#0b6e4f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="338" y="64" fill="#0b6e4f" font-size="11">同组连通</text>

    <!-- 电阻 -->
    <g transform="translate(150 70)">
      <line x1="-40" y1="0" x2="-16" y2="0" stroke="#8a8378" stroke-width="4"/>
      <rect x="-16" y="-11" width="48" height="22" rx="3" fill="#e8dcc8" stroke="#b0a48c" stroke-width="2"/>
      <line x1="-4" y1="-11" x2="-4" y2="11" stroke="#c0392b" stroke-width="4"/>
      <line x1="6" y1="-11" x2="6" y2="11" stroke="#1a1a1a" stroke-width="4"/>
      <line x1="16" y1="-11" x2="16" y2="11" stroke="#e67e22" stroke-width="4"/>
      <line x1="32" y1="0" x2="52" y2="0" stroke="#8a8378" stroke-width="4"/>
      <text x="8" y="-20" fill="#8a8378" font-size="13" font-weight="bold" text-anchor="middle">220Ω 电阻</text>
    </g>
    <!-- LED -->
    <g transform="translate(310 70)">
      <polygon points="-14,-16 -14,16 14,0" fill="#ff5252" stroke="#c62828" stroke-width="3"/>
      <line x1="14" y1="-16" x2="14" y2="16" stroke="#c62828" stroke-width="5"/>
      <line x1="-40" y1="0" x2="-14" y2="0" stroke="#8a8378" stroke-width="4"/>
      <line x1="14" y1="0" x2="50" y2="0" stroke="#8a8378" stroke-width="4"/>
      <text x="0" y="40" fill="#8a8378" font-size="13" font-weight="bold" text-anchor="middle">LED</text>
      <text x="-26" y="-26" fill="#c0392b" font-size="12" font-weight="bold">长脚 A +</text>
      <text x="30" y="-26" fill="#6b6b6b" font-size="12" font-weight="bold">短脚 C −</text>
    </g>
    <!-- 接线说明 -->
    <text x="520" y="75" fill="#e67e22" font-size="14" font-weight="bold" text-anchor="middle">GPIO4</text>
    <text x="520" y="95" fill="#8a8378" font-size="12" text-anchor="middle">经电阻 → LED</text>
    <text x="60" y="135" fill="#6b6b6b" font-size="13" font-weight="bold">回 GND 负极轨</text>
  </g>

  <!-- ============ 右下：按钮 ============ -->
  <g transform="translate(430 380)">
    <rect width="600" height="200" rx="10" fill="#f2f0ec" stroke="#c8c2b6" stroke-width="3"/>
    <text x="300" y="28" fill="#8a8378" font-size="14" font-weight="bold" text-anchor="middle">按钮（跨组插，两脚不同组）</text>
    <!-- 按钮本体 -->
    <g transform="translate(300 110)">
      <rect x="-70" y="-40" width="140" height="80" rx="8" fill="#d9dee2" stroke="#9aa0a6" stroke-width="3"/>
      <circle cx="0" cy="0" r="24" fill="#8a9099" stroke="#6b7280" stroke-width="3"/>
      <!-- 四脚 -->
      <rect x="-70" y="-52" width="18" height="14" rx="3" fill="#b8bcc2"/>
      <rect x="-70" y="38" width="18" height="14" rx="3" fill="#b8bcc2"/>
      <rect x="52" y="-52" width="18" height="14" rx="3" fill="#b8bcc2"/>
      <rect x="52" y="38" width="18" height="14" rx="3" fill="#b8bcc2"/>
      <text x="0" y="70" fill="#8a8378" font-size="13" font-weight="bold" text-anchor="middle">轻触按钮</text>
      <!-- 左脚组标签 -->
      <text x="-100" y="-38" fill="#0b6e4f" font-size="13" font-weight="bold" text-anchor="end">接 GPIO23</text>
      <line x1="-96" y1="-32" x2="-72" y2="-32" stroke="#0b6e4f" stroke-width="3"/>
      <!-- 右脚组标签 -->
      <text x="100" y="-38" fill="#6b6b6b" font-size="13" font-weight="bold">接 GND</text>
      <line x1="72" y1="-32" x2="96" y2="-32" stroke="#6b6b6b" stroke-width="3"/>
    </g>
    <!-- 说明 -->
    <text x="60" y="175" fill="#0b6e4f" font-size="14" font-weight="bold">INPUT_PULLUP：松开 = HIGH，按下 = LOW</text>
  </g>

  <!-- ============ 连线（跨区） ============ -->
  <!-- IO4 → 电阻区 -->
  <path d="M330 280 C 380 280, 380 160, 430 160" stroke="#e67e22" stroke-width="4" fill="none"/>
  <circle cx="430" cy="160" r="5" fill="#e67e22"/>
  <!-- IO23 → 按钮左脚 -->
  <path d="M330 410 C 400 410, 400 470, 470 470" stroke="#0b6e4f" stroke-width="4" fill="none"/>
  <circle cx="470" cy="470" r="5" fill="#0b6e4f"/>
  <!-- GND → 两处地 -->
  <path d="M330 530 C 500 560, 700 560, 900 560 M900 560 C 940 560, 940 300, 700 300 C 640 300, 620 250, 620 230" stroke="#7f8c8d" stroke-width="4" fill="none" stroke-dasharray="9 6"/>
  <text x="820" y="580" fill="#7f8c8d" font-size="14" font-weight="bold">GND（黑线，公共地）</text>

  <!-- 口诀 -->
  <text x="550" y="640" fill="#0b6e4f" font-size="17" font-weight="bold" text-anchor="middle">口诀：LED 跟着电阻走（串联回路）；按钮一头引脚一头地（配合内部上拉）</text>
  <text x="550" y="672" fill="#c0392b" font-size="15" font-weight="bold" text-anchor="middle">⚠ 接线前拔掉 USB！通电插拔杜邦线容易短路打火花（第 1 课三原则之二）</text>
</svg>
