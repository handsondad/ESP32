<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e8f1ec"/>
    </linearGradient>
    <filter id="ds14" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b3d30" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="440" fill="url(#bg14)"/>

  <text x="600" y="46" fill="#1a1a1a" font-size="24" font-weight="bold" text-anchor="middle">第 1 课承诺兑现 ×2：Arduino 是 IDF 上的一个库</text>

  <!-- ===== 左：Arduino 代码卡 ===== -->
  <g transform="translate(55 78)">
    <rect width="330" height="188" rx="12" fill="#fff" stroke="#00979d" stroke-width="4"/>
    <rect width="330" height="40" rx="12" fill="#00979d"/>
    <rect y="26" width="330" height="14" fill="#00979d"/>
    <text x="165" y="27" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">📒 Arduino：点菜</text>
    <g font-family="Consolas, monospace" font-size="13">
      <text x="18" y="68" fill="#333">pinMode(<tspan fill="#c0392b" font-weight="bold">4</tspan>, OUTPUT);</text>
      <text x="18" y="92" fill="#333">digitalWrite(<tspan fill="#c0392b" font-weight="bold">4</tspan>, HIGH);</text>
      <text x="18" y="116" fill="#333">delay(<tspan fill="#c0392b" font-weight="bold">500</tspan>);  <tspan fill="#9aa0a6" font-size="11">// 全局罚站</tspan></text>
      <text x="18" y="140" fill="#333">digitalWrite(<tspan fill="#c0392b" font-weight="bold">4</tspan>, LOW);</text>
      <text x="18" y="164" fill="#333">delay(<tspan fill="#c0392b" font-weight="bold">500</tspan>);</text>
    </g>
    <text x="165" y="182" fill="#00979d" font-size="12" font-weight="bold" text-anchor="middle">10 分钟出原型 · 错误被吞掉</text>
  </g>

  <!-- ===== 中：分层结构 ===== -->
  <g transform="translate(430 70)">
    <!-- 你写的代码 -->
    <rect x="60" y="0" width="280" height="54" rx="10" fill="#e6f3ee" stroke="#0b6e4f" stroke-width="3"/>
    <text x="200" y="24" fill="#0b6e4f" font-size="15" font-weight="bold" text-anchor="middle">你写的代码</text>
    <text x="200" y="45" fill="#333" font-size="12" text-anchor="middle" font-family="Consolas, monospace">digitalWrite / gpio_set_level</text>
    <!-- Arduino 层 -->
    <rect x="60" y="74" width="280" height="54" rx="10" fill="#e0f5f6" stroke="#00979d" stroke-width="3"/>
    <text x="200" y="98" fill="#00979d" font-size="15" font-weight="bold" text-anchor="middle">Arduino-ESP32 框架</text>
    <text x="200" y="119" fill="#6b6b6b" font-size="12" text-anchor="middle">← 它本身就是 IDF 上的一个库！</text>
    <!-- IDF 层 -->
    <rect x="60" y="148" width="280" height="54" rx="10" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="3"/>
    <text x="200" y="172" fill="#7fd1c1" font-size="15" font-weight="bold" text-anchor="middle">ESP-IDF 官方 SDK</text>
    <text x="200" y="193" fill="#aed6f1" font-size="12" text-anchor="middle" font-family="Consolas, monospace">gpio / FreeRTOS / TCP-IP / Wi-Fi</text>
    <!-- 寄存器层 -->
    <rect x="60" y="222" width="280" height="54" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
    <text x="200" y="246" fill="#c0392b" font-size="15" font-weight="bold" text-anchor="middle">硬件寄存器</text>
    <text x="200" y="267" fill="#6b6b6b" font-size="12" text-anchor="middle" font-family="Consolas, monospace">GPIO_OUT_W1TS 某一位 = 1</text>
    <!-- 箭头 -->
    <g stroke="#9aa0a6" stroke-width="2.5" fill="none">
      <path d="M200 54 L200 74" marker-end="url(#a14)"/>
      <path d="M200 128 L200 148" marker-end="url(#a14)"/>
      <path d="M200 202 L200 222" marker-end="url(#a14)"/>
    </g>
    <defs>
      <marker id="a14" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#9aa0a6"/>
      </marker>
    </defs>
  </g>

  <!-- ===== 右：IDF 代码卡 ===== -->
  <g transform="translate(815 78)">
    <rect width="330" height="188" rx="12" fill="#fff" stroke="#1a1a2e" stroke-width="4"/>
    <rect width="330" height="40" rx="12" fill="#1a1a2e"/>
    <rect y="26" width="330" height="14" fill="#1a1a2e"/>
    <text x="165" y="27" fill="#7fd1c1" font-size="15" font-weight="bold" text-anchor="middle">⚙️ ESP-IDF：进后厨</text>
    <g font-family="Consolas, monospace" font-size="12.5">
      <text x="16" y="66" fill="#333">gpio_config_t cfg = { ... };  <tspan fill="#9aa0a6" font-size="10.5">// 全选项摊开</tspan></text>
      <text x="16" y="90" fill="#c0392b" font-weight="bold">ESP_ERROR_CHECK(gpio_config(&amp;cfg));</text>
      <text x="16" y="114" fill="#333">gpio_set_level(<tspan fill="#0b6e4f" font-weight="bold">GPIO_NUM_4</tspan>, 1);</text>
      <text x="16" y="138" fill="#333">vTaskDelay(<tspan fill="#0b6e4f" font-weight="bold">pdMS_TO_TICKS(500)</tspan>);</text>
      <text x="16" y="162" fill="#9aa0a6" font-size="11">// 只睡本任务，FreeRTOS 调度别人</text>
    </g>
    <text x="165" y="182" fill="#1a1a2e" font-size="12" font-weight="bold" text-anchor="middle">量产级 · 每个返回值负责</text>
  </g>

  <!-- ===== 下方：对照结论 ===== -->
  <g transform="translate(55 300)">
    <rect width="1090" height="52" rx="10" fill="#fff" stroke="#0b6e4f" stroke-width="3"/>
    <text x="20" y="23" fill="#0b6e4f" font-size="15" font-weight="bold">vTaskDelay ≠ delay：</text>
    <text x="205" y="23" fill="#333" font-size="14">delay = 全体罚站（L3 的罪）；vTaskDelay = 只睡本任务，其他任务照跑（FreeRTOS 调度）</text>
    <text x="20" y="43" fill="#6b6b6b" font-size="13">选型：快速验证留 Arduino ｜ 量产/低功耗/OTA 上 IDF ｜ 还能混用——IDF 工程里 #include &lt;Arduino.h&gt;</text>
  </g>

  <!-- 承诺徽章 -->
  <g transform="translate(440 372)">
    <rect width="320" height="46" rx="23" fill="#0b6e4f"/>
    <text x="160" y="30" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">✅ L1 承诺：PlatformIO → L13 · ESP-IDF → L14</text>
  </g>
</svg>
