<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e8f1ec"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fd4ff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#4aa3ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4aa3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b3d30" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#hbg)"/>

  <!-- ===== 左：ESP32 板子 ===== -->
  <g transform="translate(210 220)" filter="url(#ds)">
    <rect x="-120" y="-175" width="240" height="350" rx="14" fill="#0f3d2e" stroke="#0a2c21" stroke-width="4"/>
    <!-- 引脚 -->
    <g fill="#c9ccd1">
      <rect x="-142" y="-145" width="32" height="11" rx="3"/><rect x="-142" y="-119" width="32" height="11" rx="3"/>
      <rect x="-142" y="-93" width="32" height="11" rx="3"/><rect x="-142" y="-67" width="32" height="11" rx="3"/>
      <rect x="-142" y="-41" width="32" height="11" rx="3"/><rect x="-142" y="-15" width="32" height="11" rx="3"/>
      <rect x="-142" y="11" width="32" height="11" rx="3"/><rect x="-142" y="37" width="32" height="11" rx="3"/>
      <rect x="-142" y="63" width="32" height="11" rx="3"/><rect x="-142" y="89" width="32" height="11" rx="3"/>
      <rect x="110" y="-145" width="32" height="11" rx="3"/><rect x="110" y="-119" width="32" height="11" rx="3"/>
      <rect x="110" y="-93" width="32" height="11" rx="3"/><rect x="110" y="-67" width="32" height="11" rx="3"/>
      <rect x="110" y="-41" width="32" height="11" rx="3"/><rect x="110" y="-15" width="32" height="11" rx="3"/>
      <rect x="110" y="11" width="32" height="11" rx="3"/><rect x="110" y="37" width="32" height="11" rx="3"/>
      <rect x="110" y="63" width="32" height="11" rx="3"/><rect x="110" y="89" width="32" height="11" rx="3"/>
    </g>
    <!-- 模块 -->
    <rect x="-78" y="-150" width="156" height="118" rx="8" fill="#c9ccd1" stroke="#9aa0a6" stroke-width="3"/>
    <text x="0" y="-104" fill="#4a5057" font-size="21" font-weight="bold" text-anchor="middle">ESP32-WROOM-32</text>
    <text x="0" y="-76" fill="#6b7280" font-size="13" text-anchor="middle">双核 240MHz · Wi-Fi · BT</text>
    <!-- 按钮 -->
    <rect x="-95" y="80" width="44" height="23" rx="4" fill="#d9dee2" stroke="#9aa0a6" stroke-width="2"/>
    <text x="-73" y="96" fill="#4a5057" font-size="12" font-weight="bold" text-anchor="middle">BOOT</text>
    <rect x="51" y="80" width="44" height="23" rx="4" fill="#d9dee2" stroke="#9aa0a6" stroke-width="2"/>
    <text x="73" y="96" fill="#4a5057" font-size="12" font-weight="bold" text-anchor="middle">EN</text>
    <!-- USB -->
    <rect x="-30" y="150" width="60" height="30" rx="5" fill="#b8bcc2" stroke="#8a9099" stroke-width="3"/>
    <!-- 板载 LED（闪烁动画：2 秒周期 = 1s 亮 1s 灭） -->
    <g>
      <circle cx="66" cy="40" r="42" fill="url(#blueGlow)">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <rect x="55" y="29" width="22" height="22" rx="4" fill="#7ec8ff" stroke="#4aa3ff" stroke-width="3">
        <animate attributeName="fill" values="#7ec8ff;#7ec8ff;#33414b;#33414b;#7ec8ff" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#4aa3ff;#4aa3ff;#55636c;#55636c;#4aa3ff" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="66" y="86" fill="#8fd6bd" font-size="13" text-anchor="middle">LED @ IO2</text>
  </g>

  <!-- ===== 中：连线 ===== -->
  <g stroke="#0b6e4f" stroke-width="3" fill="none">
    <path d="M350 190 C 430 190, 430 150, 510 150" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;28" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M350 250 C 430 250, 430 290, 510 290" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;28" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="430" y="140" fill="#0b6e4f" font-size="16" font-weight="bold" text-anchor="middle">USB</text>

  <!-- ===== 右：串口监视器 ===== -->
  <g transform="translate(540 62)" filter="url(#ds)">
    <rect width="600" height="316" rx="12" fill="#14212b" stroke="#0b1620" stroke-width="3"/>
    <!-- 标题栏 -->
    <rect width="600" height="42" rx="12" fill="#1e2f3d"/>
    <rect y="30" width="600" height="12" fill="#1e2f3d"/>
    <circle cx="24" cy="21" r="7" fill="#e74c3c"/>
    <circle cx="48" cy="21" r="7" fill="#f1c40f"/>
    <circle cx="72" cy="21" r="7" fill="#2ecc71"/>
    <text x="300" y="27" fill="#9fb6c4" font-size="16" text-anchor="middle">串口监视器 · 115200 波特率</text>
    <!-- 打印内容（滚动动画） -->
    <g font-family="Consolas, monospace" font-size="21" fill="#8fd6bd">
      <text x="24" y="82">LED ON</text>
      <text x="24" y="118" fill="#5f7484">LED OFF</text>
      <text x="24" y="154">LED ON</text>
      <text x="24" y="190" fill="#5f7484">LED OFF</text>
      <text x="24" y="226">LED ON</text>
      <text x="24" y="262" fill="#5f7484">LED OFF</text>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -36" dur="2s" repeatCount="indefinite"/>
        <text x="24" y="298">LED ON</text>
      </g>
      <rect x="132" y="70" width="14" height="24" fill="#8fd6bd">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- 右侧状态面板 -->
    <g transform="translate(340 66)">
      <rect width="232" height="228" rx="10" fill="#0d1821" stroke="#243542" stroke-width="2"/>
      <text x="116" y="34" fill="#9fb6c4" font-size="16" text-anchor="middle">GPIO2 状态</text>
      <!-- 状态灯 -->
      <circle cx="116" cy="105" r="44" fill="#132733"/>
      <circle cx="116" cy="105" r="34" fill="#7ec8ff">
        <animate attributeName="fill" values="#7ec8ff;#7ec8ff;#2a3a45;#2a3a45;#7ec8ff" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="116" y="180" fill="#ffd24d" font-size="24" font-weight="bold" text-anchor="middle">
        1s 亮 / 1s 灭
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </text>
      <text x="116" y="210" fill="#5f7484" font-size="14" text-anchor="middle">周期 2s · 0.5Hz</text>
    </g>
  </g>

  <!-- 底部标语 -->
  <text x="600" y="424" fill="#0b6e4f" font-size="19" font-weight="bold" text-anchor="middle">代码里的 digitalWrite(2, HIGH) → 芯片引脚输出 3.3V → 板上蓝灯亮 🟢</text>
</svg>
