<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e8f1ec"/>
    </linearGradient>
    <radialGradient id="breathGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#ffd24d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd24d" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b3d30" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="440" fill="url(#bg3)"/>

  <!-- ===== 左：ESP32 ===== -->
  <g transform="translate(155 215)" filter="url(#ds3)">
    <rect x="-100" y="-155" width="200" height="310" rx="13" fill="#0f3d2e" stroke="#0a2c21" stroke-width="4"/>
    <g fill="#c9ccd1">
      <rect x="-120" y="-128" width="28" height="10" rx="3"/><rect x="-120" y="-104" width="28" height="10" rx="3"/>
      <rect x="-120" y="-80" width="28" height="10" rx="3"/><rect x="-120" y="-56" width="28" height="10" rx="3"/>
      <rect x="-120" y="-32" width="28" height="10" rx="3"/><rect x="-120" y="-8" width="28" height="10" rx="3"/>
      <rect x="-120" y="16" width="28" height="10" rx="3"/><rect x="-120" y="40" width="28" height="10" rx="3"/>
      <rect x="-120" y="64" width="28" height="10" rx="3"/><rect x="-120" y="88" width="28" height="10" rx="3"/>
      <rect x="92" y="-128" width="28" height="10" rx="3"/><rect x="92" y="-104" width="28" height="10" rx="3"/>
      <rect x="92" y="-80" width="28" height="10" rx="3"/><rect x="92" y="-56" width="28" height="10" rx="3"/>
      <rect x="92" y="-32" width="28" height="10" rx="3"/><rect x="92" y="-8" width="28" height="10" rx="3"/>
      <rect x="92" y="16" width="28" height="10" rx="3"/><rect x="92" y="40" width="28" height="10" rx="3"/>
      <rect x="92" y="64" width="28" height="10" rx="3"/><rect x="92" y="88" width="28" height="10" rx="3"/>
    </g>
    <rect x="-64" y="-130" width="128" height="100" rx="8" fill="#c9ccd1" stroke="#9aa0a6" stroke-width="3"/>
    <text x="0" y="-92" fill="#4a5057" font-size="17" font-weight="bold" text-anchor="middle">ESP32</text>
    <text x="0" y="-66" fill="#6b7280" font-size="12" text-anchor="middle">analogWrite()</text>
    <rect x="-80" y="68" width="40" height="21" rx="4" fill="#d9dee2" stroke="#9aa0a6" stroke-width="2"/>
    <text x="-60" y="82" fill="#4a5057" font-size="10.5" font-weight="bold" text-anchor="middle">BOOT</text>
    <rect x="40" y="68" width="40" height="21" rx="4" fill="#d9dee2" stroke="#9aa0a6" stroke-width="2"/>
    <text x="60" y="82" fill="#4a5057" font-size="10.5" font-weight="bold" text-anchor="middle">EN</text>
    <rect x="-25" y="130" width="50" height="25" rx="5" fill="#b8bcc2" stroke="#8a9099" stroke-width="3"/>
    <text x="108" y="-50" fill="#ffd24d" font-size="13" font-weight="bold">GPIO4</text>
  </g>

  <!-- ===== 中：PWM 线 + 平均电压示意 ===== -->
  <g>
    <path d="M262 160 C 360 160, 400 140, 500 140" stroke="#e67e22" stroke-width="4" fill="none"/>
    <!-- 小方波图标在线上方 -->
    <g transform="translate(340 118)" stroke="#0b6e4f" stroke-width="3" fill="none">
      <path d="M0 14 L14 14 L14 0 L34 0 L34 14 L54 14 L54 0 L74 0 L74 14 L94 14"/>
    </g>
    <text x="390" y="96" fill="#0b6e4f" font-size="14" font-weight="bold" text-anchor="middle">5kHz 快速开关</text>
    <!-- millis 时钟图标 -->
    <g transform="translate(365 225)">
      <circle cx="30" cy="30" r="28" fill="#fff" stroke="#0b6e4f" stroke-width="3"/>
      <line x1="30" y1="30" x2="30" y2="12" stroke="#0b6e4f" stroke-width="4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 30 30;360 30 30" dur="3s" repeatCount="indefinite"/>
      </line>
      <line x1="30" y1="30" x2="44" y2="30" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
      <text x="30" y="76" fill="#0b6e4f" font-size="14" font-weight="bold" text-anchor="middle">millis() 不罚站</text>
    </g>
    <path d="M300 260 C 340 260, 360 255, 430 250" stroke="#0b6e4f" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
  </g>

  <!-- ===== 右：呼吸 LED ===== -->
  <g transform="translate(700 175)">
    <!-- 呼吸光晕（动画：渐明渐暗） -->
    <circle cx="120" cy="30" r="150" fill="url(#breathGlow)">
      <animate attributeName="r" values="95;165;95" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- LED 本体 -->
    <g>
      <circle cx="120" cy="30" r="52" fill="#ffd24d" stroke="#e6a700" stroke-width="5">
        <animate attributeName="fill" values="#5a5140;#ffd24d;#5a5140" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#6b6250;#e6a700;#6b6250" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="120" y="132" fill="#8a8378" font-size="15" font-weight="bold" text-anchor="middle">LED 呼吸中…</text>
    </g>
    <!-- 亮度曲线 -->
    <g transform="translate(20 210)">
      <line x1="0" y1="70" x2="340" y2="70" stroke="#c8cdd2"/>
      <text x="-8" y="74" text-anchor="end" fill="#9aa0a6" font-size="11">0</text>
      <text x="-8" y="14" text-anchor="end" fill="#9aa0a6" font-size="11">255</text>
      <path d="M0 70 L40 14 L120 14 L160 70 L240 70 L280 14 L340 14" fill="none" stroke="#0b6e4f" stroke-width="3" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" values="0 700;700 0" dur="3s" repeatCount="indefinite"/>
      </path>
      <!-- 平滑三角波更正：用实际路径 -->
      <path d="M0 70 Q35 8 80 14 T170 66 Q210 74 250 14 T340 14" fill="none" stroke="#3fa67a" stroke-width="3.5"/>
      <text x="170" y="98" fill="#0b6e4f" font-size="13" font-weight="bold" text-anchor="middle">亮度曲线：平滑三角波（无 delay！）</text>
    </g>
  </g>

  <!-- 右上角标注 -->
  <text x="950" y="60" fill="#c0392b" font-size="15" font-weight="bold">delay 版 ❌</text>
  <text x="950" y="84" fill="#6b6b6b" font-size="13">罚站 → 抽搐爬楼梯</text>
  <g transform="translate(945 96)" stroke="#c0392b" stroke-width="3" fill="none">
    <path d="M0 40 L20 40 L20 10 L40 10 L40 40 L60 40 L60 10 L80 10 L80 40 L100 40"/>
  </g>
  <text x="950" y="175" fill="#0b6e4f" font-size="15" font-weight="bold">millis 版 ✅</text>
  <text x="950" y="199" fill="#6b6b6b" font-size="13">自由运转 → 丝滑斜坡</text>
  <g transform="translate(945 211)" stroke="#0b6e4f" stroke-width="3" fill="none">
    <path d="M0 40 Q25 2 50 8 T100 40"/>
  </g>

  <!-- 底部标语 -->
  <text x="600" y="424" fill="#0b6e4f" font-size="18" font-weight="bold" text-anchor="middle">占空比骗过眼睛得到"半亮"，millis 记住时间告别罚站——两个新武器，一次呼吸灯全拿到</text>
</svg>
