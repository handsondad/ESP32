<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e8f1ec"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb3b3" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ff5252" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5252" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b3d30" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="440" fill="url(#bg2)"/>

  <!-- ===== 左：ESP32 板 ===== -->
  <g transform="translate(170 218)" filter="url(#ds2)">
    <rect x="-105" y="-160" width="210" height="320" rx="13" fill="#0f3d2e" stroke="#0a2c21" stroke-width="4"/>
    <g fill="#c9ccd1">
      <rect x="-126" y="-132" width="30" height="10" rx="3"/><rect x="-126" y="-108" width="30" height="10" rx="3"/>
      <rect x="-126" y="-84" width="30" height="10" rx="3"/><rect x="-126" y="-60" width="30" height="10" rx="3"/>
      <rect x="-126" y="-36" width="30" height="10" rx="3"/><rect x="-126" y="-12" width="30" height="10" rx="3"/>
      <rect x="-126" y="12" width="30" height="10" rx="3"/><rect x="-126" y="36" width="30" height="10" rx="3"/>
      <rect x="-126" y="60" width="30" height="10" rx="3"/><rect x="-126" y="84" width="30" height="10" rx="3"/>
      <rect x="96" y="-132" width="30" height="10" rx="3"/><rect x="96" y="-108" width="30" height="10" rx="3"/>
      <rect x="96" y="-84" width="30" height="10" rx="3"/><rect x="96" y="-60" width="30" height="10" rx="3"/>
      <rect x="96" y="-36" width="30" height="10" rx="3"/><rect x="96" y="-12" width="30" height="10" rx="3"/>
      <rect x="96" y="12" width="30" height="10" rx="3"/><rect x="96" y="36" width="30" height="10" rx="3"/>
      <rect x="96" y="60" width="30" height="10" rx="3"/><rect x="96" y="84" width="30" height="10" rx="3"/>
    </g>
    <rect x="-68" y="-134" width="136" height="104" rx="8" fill="#c9ccd1" stroke="#9aa0a6" stroke-width="3"/>
    <text x="0" y="-96" fill="#4a5057" font-size="18" font-weight="bold" text-anchor="middle">ESP32-WROOM-32</text>
    <text x="0" y="-70" fill="#6b7280" font-size="12" text-anchor="middle">输入 → 决策 → 输出</text>
    <rect x="-84" y="72" width="42" height="22" rx="4" fill="#d9dee2" stroke="#9aa0a6" stroke-width="2"/>
    <text x="-63" y="87" fill="#4a5057" font-size="11" font-weight="bold" text-anchor="middle">BOOT</text>
    <rect x="42" y="72" width="42" height="22" rx="4" fill="#d9dee2" stroke="#9aa0a6" stroke-width="2"/>
    <text x="63" y="87" fill="#4a5057" font-size="11" font-weight="bold" text-anchor="middle">EN</text>
    <rect x="-27" y="136" width="54" height="27" rx="5" fill="#b8bcc2" stroke="#8a9099" stroke-width="3"/>
    <!-- 引脚标签 -->
    <text x="112" y="-56" fill="#ffd24d" font-size="13" font-weight="bold">GPIO4</text>
    <text x="112" y="40" fill="#8fd6bd" font-size="13" font-weight="bold">GPIO23</text>
    <text x="-134" y="120" fill="#9fb6c4" font-size="13" font-weight="bold" text-anchor="start">GND</text>
  </g>

  <!-- ===== 中：连线 ===== -->
  <!-- GPIO4 → 面包板（LED 线） -->
  <path d="M300 150 C 400 150, 430 130, 530 130" stroke="#e67e22" stroke-width="4" fill="none"/>
  <text x="415" y="122" fill="#e67e22" font-size="14" font-weight="bold" text-anchor="middle">→ 220Ω 电阻</text>
  <!-- GPIO23 → 按钮线 -->
  <path d="M300 262 C 400 262, 430 300, 530 300" stroke="#0b6e4f" stroke-width="4" fill="none"/>
  <text x="415" y="292" fill="#0b6e4f" font-size="14" font-weight="bold" text-anchor="middle">读按钮</text>
  <!-- GND 回线 -->
  <path d="M120 300 C 260 360, 600 400, 900 400" stroke="#7f8c8d" stroke-width="4" fill="none" stroke-dasharray="10 7"/>
  <text x="560" y="392" fill="#7f8c8d" font-size="14" font-weight="bold" text-anchor="middle">GND 公共地回流</text>

  <!-- ===== 右上：面包板 LED ===== -->
  <g transform="translate(560 60)" filter="url(#ds2)">
    <rect width="330" height="150" rx="10" fill="#f2f0ec" stroke="#c8c2b6" stroke-width="3"/>
    <!-- 孔 -->
    <g fill="#fff" stroke="#a9a294" stroke-width="1.5">
      <circle cx="50" cy="35" r="7"/><circle cx="90" cy="35" r="7"/><circle cx="130" cy="35" r="7"/><circle cx="170" cy="35" r="7"/><circle cx="210" cy="35" r="7"/><circle cx="250" cy="35" r="7"/>
      <circle cx="50" cy="75" r="7"/><circle cx="90" cy="75" r="7"/><circle cx="130" cy="75" r="7"/><circle cx="170" cy="75" r="7"/><circle cx="210" cy="75" r="7"/><circle cx="250" cy="75" r="7"/>
      <circle cx="50" cy="115" r="7"/><circle cx="90" cy="115" r="7"/><circle cx="130" cy="115" r="7"/><circle cx="170" cy="115" r="7"/><circle cx="210" cy="115" r="7"/><circle cx="250" cy="115" r="7"/>
    </g>
    <!-- 电阻 -->
    <g transform="translate(60 75)">
      <line x1="-25" y1="0" x2="-8" y2="0" stroke="#8a8378" stroke-width="3"/>
      <rect x="-8" y="-9" width="36" height="18" rx="3" fill="#e8dcc8" stroke="#b0a48c" stroke-width="2"/>
      <line x1="6" y1="-9" x2="6" y2="9" stroke="#c0392b" stroke-width="3"/>
      <line x1="14" y1="-9" x2="14" y2="9" stroke="#1a1a1a" stroke-width="3"/>
      <line x1="28" y1="0" x2="42" y2="0" stroke="#8a8378" stroke-width="3"/>
      <text x="14" y="-18" fill="#8a8378" font-size="12" font-weight="bold" text-anchor="middle">220Ω</text>
    </g>
    <!-- LED（发光） -->
    <g transform="translate(185 75)">
      <circle cx="18" cy="0" r="34" fill="url(#redGlow)">
        <animate attributeName="opacity" values="0;0;1;1;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <polygon points="-4,-14 -4,14 18,0" fill="#ff5252" stroke="#c62828" stroke-width="3">
        <animate attributeName="fill" values="#7a3b3b;#7a3b3b;#ff5252;#ff5252;#7a3b3b" dur="2.4s" repeatCount="indefinite"/>
      </polygon>
      <line x1="18" y1="-14" x2="18" y2="14" stroke="#c62828" stroke-width="4"/>
      <text x="6" y="42" fill="#8a8378" font-size="12" font-weight="bold" text-anchor="middle">LED</text>
    </g>
    <text x="290" y="30" fill="#e67e22" font-size="13" font-weight="bold" text-anchor="end">GPIO4 输出</text>
  </g>

  <!-- ===== 右下：按钮 ===== -->
  <g transform="translate(560 245)" filter="url(#ds2)">
    <rect width="330" height="120" rx="10" fill="#f2f0ec" stroke="#c8c2b6" stroke-width="3"/>
    <text x="295" y="28" fill="#0b6e4f" font-size="13" font-weight="bold" text-anchor="end">GPIO23 + INPUT_PULLUP</text>
    <!-- 轻触按钮 -->
    <g transform="translate(120 60)">
      <rect x="-45" y="-28" width="90" height="56" rx="6" fill="#d9dee2" stroke="#9aa0a6" stroke-width="3"/>
      <circle cx="0" cy="0" r="18" fill="#8a9099" stroke="#6b7280" stroke-width="3">
        <animate attributeName="fill" values="#8a9099;#8a9099;#5a626a;#8a9099" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <!-- 按压手指示意 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -40; 0 -40; 0 -8; 0 -8; 0 -40" dur="2.4s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="14" ry="20" fill="#f0c9a0" stroke="#d4a574" stroke-width="2"/>
      </g>
      <text x="0" y="48" fill="#8a8378" font-size="12" font-weight="bold" text-anchor="middle">轻触按钮</text>
    </g>
    <!-- 电平指示 -->
    <g transform="translate(225 60)">
      <circle cx="0" cy="0" r="22" fill="#132733"/>
      <circle cx="0" cy="0" r="14" fill="#3fa67a">
        <animate attributeName="fill" values="#3fa67a;#3fa67a;#e74c3c;#3fa67a" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="45" fill="#6b6b6b" font-size="12" text-anchor="middle">松开=HIGH 按下=LOW</text>
    </g>
  </g>

  <!-- 底部标语 -->
  <text x="600" y="430" fill="#0b6e4f" font-size="18" font-weight="bold" text-anchor="middle">按一下 → 读到 LOW → 翻转状态 → LED 听话亮灭：这就是"输入 → 决策 → 输出"闭环</text>
</svg>
