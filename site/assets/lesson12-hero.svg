<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e8f1ec"/>
    </linearGradient>
    <filter id="ds12" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b3d30" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="440" fill="url(#bg12)"/>

  <text x="600" y="46" fill="#1a1a1a" font-size="24" font-weight="bold" text-anchor="middle">MQTT：公告栏世界观——发布者与订阅者互不认识，Broker 一切</text>

  <!-- ===== 左：ESP32 ===== -->
  <g transform="translate(60 120)" filter="url(#ds12)">
    <rect width="190" height="240" rx="13" fill="#0f3d2e" stroke="#0a2c21" stroke-width="4"/>
    <rect x="30" y="24" width="130" height="80" rx="8" fill="#c9ccd1" stroke="#9aa0a6" stroke-width="3"/>
    <text x="95" y="56" fill="#4a5057" font-size="17" font-weight="bold" text-anchor="middle">ESP32</text>
    <text x="95" y="82" fill="#6b7280" font-size="12" text-anchor="middle">PubSubClient</text>
    <g font-size="12.5" font-family="Consolas, monospace">
      <rect x="14" y="118" width="162" height="30" rx="6" fill="#1c5140"/>
      <text x="95" y="138" fill="#3fa67a" text-anchor="middle" font-weight="bold">PUB temp (QoS0)</text>
      <rect x="14" y="154" width="162" height="30" rx="6" fill="#1c5140"/>
      <text x="95" y="174" fill="#e67e22" text-anchor="middle" font-weight="bold">PUB state (Retain)</text>
      <rect x="14" y="190" width="162" height="30" rx="6" fill="#16324a"/>
      <text x="95" y="210" fill="#aed6f1" text-anchor="middle">SUB light/set</text>
    </g>
    <text x="95" y="236" fill="#8fd6bd" font-size="12" font-weight="bold" text-anchor="middle">mqtt.loop() 泵长连接</text>
  </g>

  <!-- ===== 中：云 Broker ===== -->
  <g transform="translate(430 90)">
    <!-- 云朵 -->
    <path d="M60 70 Q 60 20, 120 24 Q 150 -10, 205 16 Q 260 10, 265 60 Q 305 75, 290 120 Q 280 165, 220 160 Q 170 190, 115 165 Q 55 170, 45 120 Q 20 95, 60 70 Z"
          fill="#eaf4fb" stroke="#2980b9" stroke-width="4"/>
    <text x="170" y="60" fill="#123a5c" font-size="20" font-weight="bold" text-anchor="middle">MQTT Broker</text>
    <text x="170" y="84" fill="#2980b9" font-size="13" text-anchor="middle" font-family="Consolas, monospace">broker.emqx.io:1883</text>
    <!-- 主题表 -->
    <g font-size="11.5" font-family="Consolas, monospace">
      <rect x="70" y="98" width="200" height="24" rx="5" fill="#fff" stroke="#3fa67a" stroke-width="2"/>
      <text x="170" y="114" fill="#0b6e4f" text-anchor="middle">esp32/demo/temp = 26.4</text>
      <rect x="70" y="128" width="200" height="24" rx="5" fill="#fff" stroke="#e67e22" stroke-width="2"/>
      <text x="170" y="144" fill="#e67e22" text-anchor="middle">.../light/state = ON ★Retain</text>
    </g>
    <!-- 订阅表 -->
    <text x="170" y="176" fill="#5dade2" font-size="11.5" text-anchor="middle">订阅表：# → 手机App、仪表盘</text>
  </g>

  <!-- ===== 右：两个订阅者 ===== -->
  <g transform="translate(940 70)">
    <rect width="200" height="110" rx="12" fill="#fff" stroke="#8e44ad" stroke-width="3"/>
    <text x="100" y="34" fill="#8e44ad" font-size="16" font-weight="bold" text-anchor="middle">📱 手机 App</text>
    <text x="100" y="60" fill="#6b6b6b" font-size="12" text-anchor="middle" font-family="Consolas, monospace">SUB esp32/demo/#</text>
    <text x="100" y="84" fill="#9aa0a6" font-size="12" text-anchor="middle">人在家外，用流量看数据</text>
    <text x="100" y="102" fill="#3fa67a" font-size="11.5" font-weight="bold" text-anchor="middle">不认识发布者 ✓</text>
  </g>
  <g transform="translate(940 220)">
    <rect width="200" height="110" rx="12" fill="#fff" stroke="#e67e22" stroke-width="3"/>
    <text x="100" y="34" fill="#e67e22" font-size="16" font-weight="bold" text-anchor="middle">📈 云仪表盘</text>
    <text x="100" y="60" fill="#6b6b6b" font-size="12" text-anchor="middle" font-family="Consolas, monospace">SUB esp32/demo/temp</text>
    <!-- 迷你曲线 -->
    <polyline points="20,96 50,88 80,92 110,76 140,82 170,70" fill="none" stroke="#e67e22" stroke-width="3"/>
    <text x="100" y="104" fill="#9aa0a6" font-size="10.5" text-anchor="middle">曲线实时跳动</text>
  </g>

  <!-- ===== 连线与飞行数据 ===== -->
  <!-- ESP32 → broker -->
  <path d="M250 200 C 330 200, 360 190, 430 180" stroke="#3fa67a" stroke-width="4" fill="none"/>
  <text x="335" y="188" fill="#3fa67a" font-size="13" font-weight="bold" text-anchor="middle">PUBLISH temp</text>
  <rect x="250" y="193" width="24" height="14" rx="3" fill="#3fa67a">
    <animate attributeName="x" values="250;410" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- broker → 手机 -->
  <path d="M700 130 C 800 130, 860 125, 940 125" stroke="#8e44ad" stroke-width="4" fill="none"/>
  <text x="820" y="118" fill="#8e44ad" font-size="13" font-weight="bold" text-anchor="middle">转发（订阅表命中）</text>
  <rect x="700" y="123" width="24" height="14" rx="3" fill="#8e44ad">
    <animate attributeName="x" values="700;916" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <!-- broker → 仪表盘 -->
  <path d="M700 200 C 800 210, 860 250, 940 265" stroke="#e67e22" stroke-width="4" fill="none"/>
  <rect x="700" y="193" width="24" height="14" rx="3" fill="#e67e22">
    <animate attributeName="x" values="700;916" dur="1.2s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <!-- 手机 → broker → ESP32 控制回路 -->
  <path d="M940 300 C 820 340, 720 340, 620 330" stroke="#8e44ad" stroke-width="3.5" fill="none" stroke-dasharray="9 6"/>
  <text x="790" y="360" fill="#8e44ad" font-size="13" font-weight="bold" text-anchor="middle">PUBLISH light/set: ON（QoS1 回执）</text>
  <path d="M430 300 C 360 300, 320 310, 250 320" stroke="#3fa67a" stroke-width="3.5" fill="none" stroke-dasharray="9 6"/>
  <text x="335" y="338" fill="#3fa67a" font-size="13" font-weight="bold" text-anchor="middle">回调执行 → 回发 state</text>

  <!-- ===== QoS 对照小卡 ===== -->
  <g transform="translate(430 360)">
    <rect width="470" height="56" rx="10" fill="#fff" stroke="#0b6e4f" stroke-width="3"/>
    <text x="16" y="24" fill="#0b6e4f" font-size="14" font-weight="bold">QoS0 发出即忘（=L5 裸数据流）</text>
    <text x="16" y="45" fill="#333" font-size="13">QoS1 必有回执（= L10 的 OK 回执）　·　Retain = 新订阅者立刻拿状态</text>
    <text x="455" y="24" fill="#c0392b" font-size="13" font-weight="bold" text-anchor="end">心跳 PINGREQ</text>
    <text x="455" y="45" fill="#6b6b6b" font-size="12" text-anchor="end">= L10 reportStatus()</text>
  </g>

  <!-- 底部标语 -->
  <text x="600" y="436" fill="#0b6e4f" font-size="16" font-weight="bold" text-anchor="middle">长连接 + 主题解耦 + QoS：数据从家里的板子，跳到了世界任何角落的屏幕</text>
</svg>
