<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e8f1ec"/>
    </linearGradient>
    <filter id="ds8" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b3d30" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="440" fill="url(#bg8)"/>

  <text x="600" y="46" fill="#1a1a1a" font-size="24" font-weight="bold" text-anchor="middle">一条两线总线，三个设备：感知 → 处理 → 显示</text>

  <!-- ===== 上拉 + 母线 ===== -->
  <line x1="150" y1="108" x2="1130" y2="108" stroke="#c0392b" stroke-width="3"/>
  <text x="150" y="100" fill="#c0392b" font-size="13" font-weight="bold">3.3V</text>
  <g stroke="#8a8378" stroke-width="2" fill="none">
    <path d="M330 108 l6 -8 l12 16 l12 -16 l12 16 l12 -16 l6 8"/>
    <path d="M680 108 l6 -8 l12 16 l12 -16 l12 16 l12 -16 l6 8"/>
    <path d="M1000 108 l6 -8 l12 16 l12 -16 l12 16 l12 -16 l6 8"/>
  </g>
  <!-- SDA 母线 -->
  <line x1="150" y1="176" x2="1130" y2="176" stroke="#e67e22" stroke-width="5"/>
  <text x="1140" y="181" fill="#e67e22" font-size="14" font-weight="bold">SDA</text>
  <!-- SCL 母线 -->
  <line x1="150" y1="208" x2="1130" y2="208" stroke="#2980b9" stroke-width="5"/>
  <text x="1140" y="213" fill="#2980b9" font-size="14" font-weight="bold">SCL</text>
  <text x="640" y="234" fill="#0b6e4f" font-size="13" font-weight="bold" text-anchor="middle">GPIO21 / GPIO22 —— 第 1 课伏笔兑现：这就是"传感器主角"总线</text>

  <!-- ===== 左：ESP32 ===== -->
  <g transform="translate(60 140)" filter="url(#ds8)">
    <rect width="150" height="200" rx="12" fill="#0f3d2e" stroke="#0a2c21" stroke-width="4"/>
    <rect x="22" y="20" width="106" height="66" rx="7" fill="#c9ccd1" stroke="#9aa0a6" stroke-width="3"/>
    <text x="75" y="50" fill="#4a5057" font-size="16" font-weight="bold" text-anchor="middle">ESP32</text>
    <text x="75" y="72" fill="#6b7280" font-size="10" text-anchor="middle">主机 · 采样</text>
    <text x="12" y="120" fill="#e67e22" font-size="13" font-weight="bold">SDA 21</text>
    <text x="12" y="146" fill="#2980b9" font-size="13" font-weight="bold">SCL 22</text>
    <text x="12" y="178" fill="#7f8c8d" font-size="13" font-weight="bold">GND</text>
    <line x1="150" y1="112" x2="230" y2="176" stroke="#e67e22" stroke-width="3"/>
    <line x1="150" y1="140" x2="230" y2="208" stroke="#2980b9" stroke-width="3"/>
  </g>

  <!-- ===== 三个设备 ===== -->
  <!-- OLED -->
  <g transform="translate(300 250)">
    <rect width="180" height="130" rx="10" fill="#fff" stroke="#0b6e4f" stroke-width="3"/>
    <rect x="16" y="12" width="148" height="72" rx="5" fill="#0d1821"/>
    <text x="90" y="34" fill="#8fd6bd" font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">T=26.4 C</text>
    <text x="90" y="54" fill="#8fd6bd" font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">P=1013 hPa</text>
    <text x="90" y="74" fill="#8fd6bd" font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">R:3  P:-2</text>
    <text x="90" y="110" fill="#0b6e4f" font-size="15" font-weight="bold" text-anchor="middle">OLED · 0x3C · 显示</text>
    <line x1="50" y1="0" x2="50" y2="-30" stroke="#e67e22" stroke-width="3"/>
    <line x1="90" y1="0" x2="90" y2="-24" stroke="#2980b9" stroke-width="3"/>
  </g>
  <!-- BMP280 -->
  <g transform="translate(560 250)">
    <rect width="180" height="130" rx="10" fill="#fff" stroke="#e67e22" stroke-width="3"/>
    <text x="90" y="40" fill="#e67e22" font-size="18" font-weight="bold" text-anchor="middle">BMP280</text>
    <!-- 温度/气压小图标 -->
    <text x="90" y="72" fill="#6b6b6b" font-size="14" text-anchor="middle">🌡️ 温度  ⛰ 气压</text>
    <text x="90" y="100" fill="#9aa0a6" font-size="12" text-anchor="middle">原始值 → 校准公式</text>
    <text x="90" y="122" fill="#e67e22" font-size="13" font-weight="bold" text-anchor="middle">0x76 · 感知</text>
    <line x1="50" y1="0" x2="50" y2="-30" stroke="#e67e22" stroke-width="3"/>
    <line x1="90" y1="0" x2="90" y2="-24" stroke="#2980b9" stroke-width="3"/>
    <!-- 数据上行包 -->
    <rect x="120" y="-46" width="22" height="12" rx="3" fill="#e67e22">
      <animate attributeName="y" values="-16;-60" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- MPU6050 -->
  <g transform="translate(820 250)">
    <rect width="180" height="130" rx="10" fill="#fff" stroke="#8e44ad" stroke-width="3"/>
    <text x="90" y="40" fill="#8e44ad" font-size="18" font-weight="bold" text-anchor="middle">MPU6050</text>
    <!-- 倾斜的小板 -->
    <g transform="translate(90 74)">
      <rect x="-24" y="-11" width="48" height="22" rx="4" fill="#0f3d2e" transform="rotate(-18)">
        <animateTransform attributeName="transform" type="rotate" values="-18;14;-18" dur="3s" repeatCount="indefinite" additive="sum"/>
      </rect>
      <circle cx="0" cy="0" r="3" fill="#8fd6bd"/>
    </g>
    <text x="90" y="110" fill="#9aa0a6" font-size="12" text-anchor="middle">加速度 → atan2 → 倾角</text>
    <text x="90" y="128" fill="#8e44ad" font-size="13" font-weight="bold" text-anchor="middle">0x68 · 姿态</text>
    <line x1="50" y1="0" x2="50" y2="-30" stroke="#e67e22" stroke-width="3"/>
    <line x1="90" y1="0" x2="90" y2="-24" stroke="#2980b9" stroke-width="3"/>
  </g>

  <!-- ===== 右：数据流汇总到屏 ===== -->
  <g transform="translate(1055 130)">
    <path d="M-10 40 C 40 40, 40 70, 40 110" stroke="#0b6e4f" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
    <text x="40" y="132" fill="#0b6e4f" font-size="12" font-weight="bold" text-anchor="middle">三路数据</text>
    <text x="40" y="152" fill="#0b6e4f" font-size="12" font-weight="bold" text-anchor="middle">同屏刷新</text>
  </g>

  <!-- 总线上跑的帧 -->
  <rect x="150" y="169" width="26" height="14" rx="3" fill="#e67e22">
    <animate attributeName="x" values="150;1090" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1090" y="201" width="26" height="14" rx="3" fill="#2980b9">
    <animate attributeName="x" values="1090;150" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
  </rect>

  <!-- 底部标语 -->
  <text x="600" y="424" fill="#0b6e4f" font-size="17" font-weight="bold" text-anchor="middle">物理量 → 原始字节 → 校准换算 → 单位 → 像素：真实世界第一次流进你的程序</text>
</svg>
