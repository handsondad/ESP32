<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e8f1ec"/>
    </linearGradient>
    <filter id="ds13" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b3d30" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="440" fill="url(#bg13)"/>

  <text x="600" y="46" fill="#1a1a1a" font-size="24" font-weight="bold" text-anchor="middle">第 1 课的承诺兑现：PlatformIO——从写草稿到做工程</text>

  <!-- ===== 左：Arduino IDE 草稿本 ===== -->
  <g transform="translate(60 90)">
    <rect width="360" height="250" rx="14" fill="#fff" stroke="#00979d" stroke-width="4"/>
    <rect width="360" height="46" rx="14" fill="#00979d"/>
    <rect y="30" width="360" height="16" fill="#00979d"/>
    <text x="180" y="30" fill="#fff" font-size="17" font-weight="bold" text-anchor="middle">📒 Arduino IDE · 草稿本</text>
    <!-- 单文件 -->
    <rect x="24" y="66" width="312" height="150" rx="8" fill="#f6f8f7" stroke="#cfd8d5"/>
    <text x="180" y="92" fill="#00979d" font-size="15" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">sketch_mar25.ino</text>
    <!-- 堆积的代码行 -->
    <g fill="#cfd8d5">
      <rect x="44" y="106" width="200" height="7" rx="3"/>
      <rect x="44" y="120" width="250" height="7" rx="3"/>
      <rect x="44" y="134" width="170" height="7" rx="3"/>
      <rect x="44" y="148" width="230" height="7" rx="3"/>
      <rect x="44" y="162" width="190" height="7" rx="3"/>
      <rect x="44" y="176" width="260" height="7" rx="3"/>
      <rect x="44" y="190" width="150" height="7" rx="3"/>
    </g>
    <text x="180" y="236" fill="#c0392b" font-size="13" font-weight="bold" text-anchor="middle">全堆一个文件 · 库永远最新 · 换电脑重来</text>
  </g>

  <!-- ===== 中：升级箭头 ===== -->
  <g transform="translate(455 185)">
    <text x="45" y="-40" fill="#0b6e4f" font-size="15" font-weight="bold" text-anchor="middle">工程化迁移</text>
    <path d="M0 0 L75 0" stroke="#0b6e4f" stroke-width="5" marker-end="url(#a13)"/>
    <path d="M60 -12 L78 0 L60 12" fill="none" stroke="#0b6e4f" stroke-width="5"/>
    <text x="38" y="34" fill="#6b6b6b" font-size="12" text-anchor="middle">同一件事</text>
    <text x="38" y="52" fill="#6b6b6b" font-size="12" text-anchor="middle">换个做法</text>
    <defs>
      <marker id="a13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#0b6e4f"/>
      </marker>
    </defs>
  </g>

  <!-- ===== 右：PlatformIO 工程台 ===== -->
  <g transform="translate(560 90)">
    <rect width="580" height="250" rx="14" fill="#fff" stroke="#1a1a2e" stroke-width="4"/>
    <rect width="580" height="46" rx="14" fill="#1a1a2e"/>
    <rect y="30" width="580" height="16" fill="#1a1a2e"/>
    <text x="290" y="30" fill="#7fd1c1" font-size="17" font-weight="bold" text-anchor="middle">🐜 PlatformIO · 工程台（VS Code）</text>

    <!-- 目录树 -->
    <g transform="translate(20 64)" font-family="Consolas, monospace" font-size="13">
      <text x="0" y="0" fill="#1a1a2e" font-weight="bold">my-esp32-project/</text>
      <text x="14" y="22" fill="#e67e22" font-weight="bold">platformio.ini</text>
      <text x="150" y="22" fill="#9aa0a6" font-size="11">← 板型+库版本+波特率</text>
      <text x="14" y="44" fill="#2980b9" font-weight="bold">src/</text>
      <text x="34" y="66" fill="#333">main.cpp</text>
      <text x="34" y="88" fill="#333">button.cpp  button.h</text>
      <text x="34" y="110" fill="#333">wifi.cpp     mqtt.cpp</text>
      <text x="14" y="132" fill="#2980b9" font-weight="bold">include/</text>
      <text x="34" y="154" fill="#333">config.h  ← 引脚常量唯一出处</text>
      <text x="14" y="176" fill="#2980b9" font-weight="bold">lib/  test/</text>
    </g>

    <!-- 右侧：一键命令 -->
    <g transform="translate(360 70)">
      <rect width="200" height="30" rx="8" fill="#1a1a2e"/>
      <text x="100" y="19" fill="#7fd1c1" font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">pio run</text>
      <rect y="38" width="200" height="30" rx="8" fill="#1a1a2e"/>
      <text x="100" y="57" fill="#7fd1c1" font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">pio run -t upload</text>
      <rect y="76" width="200" height="30" rx="8" fill="#1a1a2e"/>
      <text x="100" y="95" fill="#7fd1c1" font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">pio device monitor</text>
      <rect y="114" width="200" height="30" rx="8" fill="#0b6e4f"/>
      <text x="100" y="133" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">✓ 可复现 · 可协作</text>
    </g>
    <text x="290" y="238" fill="#0b6e4f" font-size="13" font-weight="bold" text-anchor="middle">换电脑 → 拉代码 → pio run → 结果一模一样</text>
  </g>

  <!-- ===== 下方：锁版本示意 ===== -->
  <g transform="translate(60 366)">
    <rect width="1080" height="54" rx="10" fill="#fff" stroke="#0b6e4f" stroke-width="3"/>
    <text x="20" y="24" fill="#0b6e4f" font-size="15" font-weight="bold">锁版本的意义：</text>
    <text x="20" y="44" fill="#333" font-size="13" font-family="Consolas, monospace">lib_deps = adafruit/Adafruit SSD1306@^2.5.9</text>
    <text x="470" y="44" fill="#6b6b6b" font-size="13">→ 今天能编译，半年后换台电脑，拉到的库一模一样——"在我电脑上能跑"成为历史</text>
    <text x="1060" y="24" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="end">Arduino IDE：永远最新 ✗</text>
  </g>
</svg>
