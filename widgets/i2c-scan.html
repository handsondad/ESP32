<!-- 组件：I2C 地址扫描时序动画 · 用于第 7 课 -->
<div class="wgt wgt-scan" id="wg-scan">
  <div class="wgt-head"><span>🔍 交互演示：I2C 地址扫描全过程</span><span class="wgt-badge">点"开始扫描"看总线点名</span></div>
  <div class="wgt-body">
    <!-- 总线拓扑图 -->
    <svg viewBox="0 0 640 190" style="width:100%;height:auto;display:block" id="wg-scan-svg">
      <!-- 上拉电阻 + 3.3V -->
      <line x1="40" y1="26" x2="600" y2="26" stroke="#c0392b" stroke-width="3"/>
      <text x="40" y="18" fill="#c0392b" font-size="12" font-weight="bold">3.3V</text>
      <g stroke="#8a8378" stroke-width="2" fill="none">
        <path d="M140 26 l6 -7 l12 14 l12 -14 l12 14 l12 -14 l6 7"/>
        <path d="M210 26 l6 -7 l12 14 l12 -14 l12 14 l12 -14 l6 7"/>
      </g>
      <line x1="170" y1="33" x2="170" y2="70" stroke="#e67e22" stroke-width="1.8" stroke-dasharray="3 3"/>
      <line x1="240" y1="33" x2="240" y2="94" stroke="#2980b9" stroke-width="1.8" stroke-dasharray="3 3"/>
      <text x="170" y="18" fill="#e67e22" font-size="10" text-anchor="middle">10kΩ SDA</text>
      <text x="240" y="18" fill="#2980b9" font-size="10" text-anchor="middle">10kΩ SCL</text>
      <!-- SDA / SCL 母线 -->
      <line id="wg-scan-sda" x1="60" y1="70" x2="580" y2="70" stroke="#e67e22" stroke-width="4"/>
      <line id="wg-scan-scl" x1="60" y1="94" x2="580" y2="94" stroke="#2980b9" stroke-width="4"/>
      <text x="588" y="74" fill="#e67e22" font-size="12" font-weight="bold">SDA</text>
      <text x="588" y="98" fill="#2980b9" font-size="12" font-weight="bold">SCL</text>
      <!-- 主机 -->
      <rect x="60" y="118" width="110" height="52" rx="8" fill="#0f3d2e"/>
      <text x="115" y="140" fill="#8fd6bd" font-size="13" font-weight="bold" text-anchor="middle">ESP32</text>
      <text x="115" y="160" fill="#5f7484" font-size="11" text-anchor="middle">主机 · 点名</text>
      <line x1="115" y1="118" x2="115" y2="94" stroke="#2980b9" stroke-width="3"/>
      <line x1="115" y1="118" x2="90" y2="70" stroke="#e67e22" stroke-width="3"/>
      <!-- 三个从机 -->
      <g id="wg-scan-devs">
        <g data-addr="0x3C">
          <rect x="230" y="118" width="110" height="52" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="2"/>
          <text x="285" y="140" fill="#0b6e4f" font-size="13" font-weight="bold" text-anchor="middle">OLED</text>
          <text x="285" y="160" fill="#6b6b6b" font-size="12" text-anchor="middle">0x3C</text>
          <line x1="285" y1="118" x2="285" y2="94" stroke="#2980b9" stroke-width="3"/>
          <line x1="262" y1="118" x2="245" y2="70" stroke="#e67e22" stroke-width="3"/>
        </g>
        <g data-addr="0x68">
          <rect x="370" y="118" width="110" height="52" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="2"/>
          <text x="425" y="140" fill="#0b6e4f" font-size="13" font-weight="bold" text-anchor="middle">MPU6050</text>
          <text x="425" y="160" fill="#6b6b6b" font-size="12" text-anchor="middle">0x68</text>
          <line x1="425" y1="118" x2="425" y2="94" stroke="#2980b9" stroke-width="3"/>
          <line x1="402" y1="118" x2="385" y2="70" stroke="#e67e22" stroke-width="3"/>
        </g>
        <g data-addr="0x76">
          <rect x="510" y="118" width="110" height="52" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="2"/>
          <text x="565" y="140" fill="#0b6e4f" font-size="13" font-weight="bold" text-anchor="middle">BMP280</text>
          <text x="565" y="160" fill="#6b6b6b" font-size="12" text-anchor="middle">0x76</text>
          <line x1="565" y1="118" x2="565" y2="94" stroke="#2980b9" stroke-width="3"/>
          <line x1="542" y1="118" x2="525" y2="70" stroke="#e67e22" stroke-width="3"/>
        </g>
      </g>
      <!-- 点名脉冲（沿 SDA 跑） -->
      <circle id="wg-scan-pulse" cx="60" cy="70" r="7" fill="#e67e22" opacity="0"/>
    </svg>

    <!-- 控制与串口输出 -->
    <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap">
      <button id="wg-scan-btn" class="wg-scan-btn">▶ 开始扫描</button>
      <div class="wg-scan-status" id="wg-scan-status">待机：准备逐个点名 0x01 – 0x7E</div>
    </div>
    <div id="wg-scan-term" class="wg-scan-term">扫描 I2C 地址...</div>
    <p class="wgt-hint" style="text-align:center">橙色脉冲是主机发出的<b>地址帧</b>：对上的设备（0x3C/0x68/0x76）把 SDA 拉低回一个 <b>ACK</b>，没对上的保持沉默（NACK）。这就是"地址扫描"——第 8 课接新传感器，第一件事仍是跑它。</p>
  </div>
</div>
<style>
.wg-scan-btn { font-family: inherit; font-size: .9em; padding: .5em 1.2em; border-radius: 8px; border: 1px solid #0b6e4f; background: #0b6e4f; color: #fff; cursor: pointer; }
.wg-scan-btn:disabled { opacity: .5; cursor: default; }
.wg-scan-status { font-size: .85em; color: #6b6b6b; }
.wg-scan-term { margin-top: 8px; background: #0d1821; color: #8fd6bd; font-family: Consolas, monospace; font-size: .85em; padding: .6em .8em; min-height: 92px; line-height: 1.65; white-space: pre-wrap; border-radius: 6px; }
.wgt-scan .wgt-badge { font-weight: 400; font-size: .8em; color: var(--muted); }
</style>
<script>
(function () {
  const root = document.getElementById('wg-scan');
  if (!root || root.dataset.bound) return; root.dataset.bound = '1';
  const btn = document.getElementById('wg-scan-btn');
  const status = document.getElementById('wg-scan-status');
  const term = document.getElementById('wg-scan-term');
  const pulse = document.getElementById('wg-scan-pulse');
  const sda = document.getElementById('wg-scan-sda');
  const devs = Array.from(document.querySelectorAll('#wg-scan-devs g'));
  const FOUND = ['0x3C', '0x68', '0x76'];

  let running = false;

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function flashDevice(addr) {
    const g = devs.find(d => d.getAttribute('data-addr') === addr);
    if (!g) return;
    const rect = g.querySelector('rect');
    rect.setAttribute('fill', '#d9f2e7');
    setTimeout(() => rect.setAttribute('fill', '#fff'), 450);
  }

  async function pulseTo(x, stepMs) {
    pulse.setAttribute('opacity', '1');
    const from = 60, to = x, steps = 8;
    for (let i = 0; i <= steps; i++) {
      const px = from + (to - from) * i / steps;
      pulse.setAttribute('cx', px);
      await sleep(stepMs);
    }
    pulse.setAttribute('opacity', '0');
  }

  async function scan() {
    if (running) return;
    running = true;
    btn.disabled = true;
    term.textContent = '扫描 I2C 地址 (0x01 - 0x7E)...\n';
    const found = [];
    // 抽样演示关键地址段（覆盖全范围 + 命中设备必扫，总耗时约 4 秒）
    const sequence = [0x01, 0x08, 0x18, 0x20, 0x27, 0x38, 0x3C, 0x40, 0x48, 0x50, 0x5A, 0x68, 0x69, 0x70, 0x76, 0x77, 0x7E];
    const devX = { '0x3C': 245, '0x68': 385, '0x76': 525 };
    for (const addr of sequence) {
      const hex = '0x' + addr.toString(16).toUpperCase().padStart(2, '0');
      status.textContent = `点名中：${hex} ...`;
      const hit = FOUND.includes(hex);
      await pulseTo(hit ? devX[hex] : 60 + (addr / 0x7E) * 510, hit ? 22 : 12);
      if (hit) {
        flashDevice(hex);
        sda.setAttribute('stroke', '#0b6e4f');
        setTimeout(() => sda.setAttribute('stroke', '#e67e22'), 320);
        term.textContent += `发现设备: ${hex}  ✓ ACK\n`;
        found.push(hex);
        await sleep(340);
      } else {
        await sleep(20);
      }
    }
    status.textContent = `扫描完成：总线上有 ${found.length} 个设备（${found.join('、')}）`;
    term.textContent += `\n扫描结束。共 ${found.length} 个应答。\n→ OLED 地址就是 ${found[0] || '0x3C'}，写进代码！`;
    btn.disabled = false;
    running = false;
  }

  btn.onclick = scan;
})();
</script>
