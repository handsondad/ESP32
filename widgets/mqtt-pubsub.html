<!-- 组件：MQTT 发布订阅流动 · 用于第 12 课 -->
<div class="wgt wgt-mqtt" id="wg-mqtt">
  <div class="wgt-head"><span>📡 交互演示：消息如何在 broker 周转</span><span class="wgt-badge">点发布/控制，看订阅者收到什么</span></div>
  <div class="wgt-body">
    <!-- 拓扑 -->
    <svg viewBox="0 0 640 230" style="width:100%;height:auto;display:block" id="wg-mqtt-svg">
      <!-- 左：ESP32 发布者 -->
      <g transform="translate(20 55)">
        <rect width="150" height="120" rx="10" fill="#0f3d2e"/>
        <text x="75" y="34" fill="#8fd6bd" font-size="15" font-weight="bold" text-anchor="middle">ESP32</text>
        <text x="75" y="58" fill="#5f7484" font-size="11" text-anchor="middle">发布 temp/state</text>
        <text x="75" y="78" fill="#5f7484" font-size="11" text-anchor="middle">订阅 light/set</text>
        <!-- 板上 LED -->
        <circle cx="75" cy="102" r="10" id="wg-mqtt-led" fill="#5a5140" stroke="#6b6250" stroke-width="2"/>
      </g>
      <!-- 中：Broker -->
      <g transform="translate(245 40)">
        <rect width="150" height="150" rx="12" fill="#123a5c" stroke="#0b2740" stroke-width="3"/>
        <text x="75" y="36" fill="#aed6f1" font-size="16" font-weight="bold" text-anchor="middle">Broker</text>
        <text x="75" y="58" fill="#5dade2" font-size="12" text-anchor="middle">broker.emqx.io</text>
        <!-- 主题队列 -->
        <rect x="12" y="72" width="126" height="22" rx="5" fill="#1c5140"/>
        <text x="75" y="87" fill="#8fd6bd" font-size="10.5" text-anchor="middle" font-family="Consolas, monospace">esp32/demo/temp</text>
        <rect x="12" y="100" width="126" height="22" rx="5" fill="#1c5140"/>
        <text x="75" y="115" fill="#8fd6bd" font-size="10.5" text-anchor="middle" font-family="Consolas, monospace">.../light/state ★</text>
        <rect x="12" y="128" width="126" height="18" rx="5" fill="#16324a"/>
        <text x="75" y="141" fill="#5dade2" font-size="10" text-anchor="middle">★ = Retain 已记住</text>
      </g>
      <!-- 右上：手机订阅者 -->
      <g transform="translate(470 20)">
        <rect width="140" height="86" rx="10" fill="#fff" stroke="#8e44ad" stroke-width="3"/>
        <text x="70" y="30" fill="#8e44ad" font-size="14" font-weight="bold" text-anchor="middle">📱 手机 App</text>
        <text x="70" y="52" fill="#6b6b6b" font-size="11" text-anchor="middle" font-family="Consolas, monospace">订阅 esp32/demo/#</text>
        <text x="70" y="74" fill="#9aa0a6" font-size="11" text-anchor="middle">不认识发布者是谁</text>
      </g>
      <!-- 右下：仪表盘 -->
      <g transform="translate(470 130)">
        <rect width="140" height="86" rx="10" fill="#fff" stroke="#e67e22" stroke-width="3"/>
        <text x="70" y="30" fill="#e67e22" font-size="14" font-weight="bold" text-anchor="middle">📈 云仪表盘</text>
        <text x="70" y="52" fill="#6b6b6b" font-size="11" text-anchor="middle" font-family="Consolas, monospace">订阅 .../temp</text>
        <text x="70" y="74" fill="#9aa0a6" font-size="11" text-anchor="middle">曲线实时跳动</text>
      </g>
      <!-- 连线 -->
      <line x1="170" y1="115" x2="245" y2="115" stroke="#3fa67a" stroke-width="3"/>
      <line x1="395" y1="90" x2="470" y2="63" stroke="#8e44ad" stroke-width="3"/>
      <line x1="395" y1="140" x2="470" y2="173" stroke="#e67e22" stroke-width="3"/>
      <!-- 飞行包 -->
      <rect id="wg-mqtt-pkt" x="170" y="108" width="24" height="14" rx="3" fill="#3fa67a" opacity="0"/>
      <rect id="wg-mqtt-pkt2" x="395" y="133" width="24" height="14" rx="3" fill="#e67e22" opacity="0"/>
    </svg>

    <!-- 控制 -->
    <div class="wg-mqtt-ctrl">
      <button id="wg-mqtt-pub" class="b1">🌡️ 板子发布 temp（QoS0）</button>
      <button id="wg-mqtt-on" class="b2">📱 手机发布 light/set: ON</button>
      <button id="wg-mqtt-off" class="b2">📱 light/set: OFF</button>
      <button id="wg-mqtt-ret" class="b3">📱 新客户端连上（要 Retain）</button>
    </div>
    <div class="wg-mqtt-log" id="wg-mqtt-log">观察区：每次操作会显示"谁发布了什么 → broker 怎么转 → 谁收到了"。</div>
    <p class="wgt-hint" style="text-align:center">注意 <b>Retain 按钮</b>：新客户端一订阅 <code>light/state</code>，<b>立刻</b>收到最近一次的状态——不用等板子下次发布。这就是第 11 课"重启状态丢失"的官方解法。</p>
  </div>
</div>
<style>
.wg-mqtt-ctrl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.wg-mqtt-ctrl button { font-family: inherit; font-size: .84em; padding: .45em .9em; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; transition: .15s; }
.wg-mqtt-ctrl .b1:hover { border-color: #3fa67a; }
.wg-mqtt-ctrl .b2:hover { border-color: #8e44ad; }
.wg-mqtt-ctrl .b3:hover { border-color: #e67e22; }
.wg-mqtt-ctrl button:disabled { opacity: .5; cursor: default; }
.wg-mqtt-log { margin-top: 10px; background: #0d1821; color: #8fd6bd; font-family: Consolas, monospace; font-size: .8em; padding: .6em .8em; min-height: 88px; line-height: 1.7; white-space: pre-wrap; border-radius: 6px; }
.wgt-mqtt .wgt-badge { font-weight: 400; font-size: .8em; color: var(--muted); }
</style>
<script>
(function () {
  const root = document.getElementById('wg-mqtt');
  if (!root || root.dataset.bound) return; root.dataset.bound = '1';
  const pkt = document.getElementById('wg-mqtt-pkt');
  const pkt2 = document.getElementById('wg-mqtt-pkt2');
  const log = document.getElementById('wg-mqtt-log');
  const led = document.getElementById('wg-mqtt-led');
  const btns = {
    pub: document.getElementById('wg-mqtt-pub'),
    on: document.getElementById('wg-mqtt-on'),
    off: document.getElementById('wg-mqtt-off'),
    ret: document.getElementById('wg-mqtt-ret')
  };
  let busy = false, ledOn = false, lastState = 'OFF';

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function write(t) { log.textContent = t; }
  async function fly(el, p1, p2, color, dur) {
    el.setAttribute('fill', color);
    el.setAttribute('opacity', '1');
    const steps = 20;
    for (let i = 0; i <= steps; i++) {
      const k = i / steps;
      el.setAttribute('x', (p1[0] + (p2[0] - p1[0]) * k - 12).toFixed(1));
      el.setAttribute('y', (p1[1] + (p2[1] - p1[1]) * k - 7).toFixed(1));
      await sleep(dur / steps);
    }
    el.setAttribute('opacity', '0');
  }
  async function run(fn) {
    if (busy) return;
    busy = true;
    Object.values(btns).forEach(b => b.disabled = true);
    try { await fn(); } finally {
      Object.values(btns).forEach(b => b.disabled = false);
      busy = false;
    }
  }

  const ESP = [170, 115];
  const BRK_L = [245, 115];
  const BRK_TOP = [395, 90], PHONE = [470, 63];
  const BRK_BOT = [395, 140], DASH = [470, 173];

  btns.pub.onclick = () => run(async () => {
    const t = (20 + Math.random() * 12).toFixed(1);
    write(`ESP32 → broker：PUBLISH esp32/demo/temp = "${t}" (QoS0，不等回执)`);
    await fly(pkt, ESP, BRK_L, '#3fa67a', 420);
    write(`broker 收到：查订阅表——手机 App(#) 与 云仪表盘(temp) 均命中，同时转发！`);
    await Promise.all([
      fly(pkt, BRK_TOP, PHONE, '#8e44ad', 440),
      fly(pkt2, BRK_BOT, DASH, '#e67e22', 440)
    ]);
    write(`✅ 手机 App 与云仪表盘同时收到 ${t} °C（它们根本不知道发布者是谁，只认主题）\n   QoS0：丢了也无所谓——5 秒后又有新数据。`);
  });

  btns.on.onclick = () => run(async () => { await setLight('ON'); });
  btns.off.onclick = () => run(async () => { await setLight('OFF'); });

  async function setLight(cmd) {
    write(`手机 → broker：PUBLISH esp32/demo/light/set = "${cmd}" (QoS1)`);
    await fly(pkt, PHONE, BRK_TOP, '#8e44ad', 420);
    write(`broker 转发 → ESP32 订阅了 light/set，回调 onMqttMessage() 被触发`);
    await fly(pkt, BRK_L, ESP, '#3fa67a', 420);
    ledOn = (cmd === 'ON');
    led.setAttribute('fill', ledOn ? '#ffd24d' : '#5a5140');
    led.setAttribute('stroke', ledOn ? '#e6a700' : '#6b6250');
    lastState = cmd;
    write(`ESP32 执行：digitalWrite(LED, ${ledOn ? 'HIGH' : 'LOW'})\n然后回发：PUBLISH .../light/state = "${cmd}" (Retain=true) → broker 记住了！`);
    await fly(pkt, ESP, BRK_L, '#e67e22', 380);
  }

  btns.ret.onclick = () => run(async () => {
    write(`新客户端连接 broker，SUBSCRIBE esp32/demo/light/state ...`);
    await fly(pkt, BRK_TOP, PHONE, '#e67e22', 420);
    write(`✅ Retain 生效：broker 立刻推送最后一条保留消息 "${lastState}" —— 不用等板子下次发布。\n   （客户端重连/新打开 App 丢状态的问题在此解决）`);
  });
})();
</script>
