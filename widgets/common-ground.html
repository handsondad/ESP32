<!-- 组件：共地破坏实验 · 用于第 5 课破坏性实验 -->
<div class="wgt wgt-gnd" id="wg-gnd">
  <div class="wgt-head"><span>⚡ 交互实验：拔掉 GND，制造乱码</span><span class="wgt-badge">点开关断开/接回地线</span></div>
  <div class="wgt-body">
    <svg viewBox="0 0 640 250" style="width:100%;height:auto;display:block" id="wg-gnd-svg">
      <!-- 左芯片 -->
      <rect x="30" y="55" width="150" height="140" rx="10" fill="#0f3d2e" stroke="#0a2c21" stroke-width="3"/>
      <text x="105" y="85" fill="#8fd6bd" font-size="14" font-weight="bold" text-anchor="middle">ESP32</text>
      <text x="105" y="107" fill="#5f7484" font-size="11" text-anchor="middle">发: Hello #N</text>
      <!-- TX 线 -->
      <line x1="180" y1="130" x2="460" y2="130" stroke="#e67e22" stroke-width="4"/>
      <text x="320" y="122" fill="#e67e22" font-size="12" font-weight="bold" text-anchor="middle">TX(17) → RX</text>
      <!-- TX 上的流动数据包 -->
      <rect id="wg-gnd-pkt" x="185" y="123" width="26" height="14" rx="3" fill="#e67e22">
        <animate attributeName="x" values="185;430" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <!-- GND 线（可断开） -->
      <g id="wg-gnd-wire">
        <line x1="180" y1="185" x2="310" y2="185" stroke="#4a5b66" stroke-width="5"/>
        <line x1="330" y1="185" x2="460" y2="185" stroke="#4a5b66" stroke-width="5"/>
        <line id="wg-gnd-bridge" x1="310" y1="185" x2="330" y2="185" stroke="#4a5b66" stroke-width="5"/>
        <text x="320" y="207" fill="#4a5b66" font-size="12" font-weight="bold" text-anchor="middle">GND</text>
      </g>
      <!-- 断开时的红叉 -->
      <g id="wg-gnd-x" opacity="0">
        <line x1="303" y1="176" x2="337" y2="194" stroke="#e74c3c" stroke-width="5" stroke-linecap="round"/>
        <line x1="337" y1="176" x2="303" y2="194" stroke="#e74c3c" stroke-width="5" stroke-linecap="round"/>
      </g>
      <!-- 右芯片 -->
      <rect x="460" y="55" width="150" height="140" rx="10" fill="#0f3d2e" stroke="#0a2c21" stroke-width="3"/>
      <text x="535" y="85" fill="#8fd6bd" font-size="14" font-weight="bold" text-anchor="middle">对方设备</text>
      <text x="535" y="107" fill="#5f7484" font-size="11" text-anchor="middle">采样判 1/0</text>
      <!-- 参照箭头：从对方 GND 指向 TX 线 -->
      <path id="wg-gnd-ref" d="M460 185 L460 140" stroke="#4a5b66" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#refA)"/>
      <text id="wg-gnd-reftext" x="448" y="165" fill="#4a5b66" font-size="10.5" text-anchor="end">以自家 GND 为参照量电压</text>
      <defs>
        <marker id="refA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" fill="#4a5b66"/>
        </marker>
      </defs>
    </svg>

    <!-- 接收窗口模拟 -->
    <div class="wg-gnd-term">
      <div class="wg-gnd-termbar">
        <span>对方设备 · 接收窗口</span>
        <button id="wg-gnd-toggle">🔌 断开 GND</button>
      </div>
      <div id="wg-gnd-screen" class="wg-gnd-screen">Hello from ESP32 #1
Hello from ESP32 #2
Hello from ESP32 #3</div>
    </div>
    <p class="wgt-hint" style="text-align:center">断开地线：<b>数据包还在 TX 线上跑（橙色），但对方失去了“零”的参照</b>——采样掷硬币，接收窗口变乱码。接回地线立刻恢复。第 9 课讲帧格式时，我们再回来解释乱码的具体形态。</p>
  </div>
</div>
<style>
.wg-gnd-term { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.wg-gnd-termbar { display: flex; justify-content: space-between; align-items: center; padding: .45em .8em; background: #1e2f3d; color: #9fb6c4; font-size: .85em; }
.wg-gnd-termbar button { font-family: inherit; font-size: .85em; padding: .3em .9em; border-radius: 6px; border: 1px solid #3fa67a; background: #0b6e4f; color: #fff; cursor: pointer; }
.wg-gnd-termbar button.off { background: #c0392b; border-color: #c0392b; }
.wg-gnd-screen { background: #0d1821; color: #8fd6bd; font-family: Consolas, monospace; font-size: .9em; padding: .7em .9em; min-height: 84px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; }
.wg-gnd-screen.garbled { color: #e74c3c; }
.wgt-gnd .wgt-badge { font-weight: 400; font-size: .8em; color: var(--muted); }
</style>
<script>
(function () {
  const root = document.getElementById('wg-gnd');
  if (!root || root.dataset.bound) return;
  root.dataset.bound = '1';
  const btn = document.getElementById('wg-gnd-toggle');
  const screen = document.getElementById('wg-gnd-screen');
  const bridge = document.getElementById('wg-gnd-bridge');
  const xmark = document.getElementById('wg-gnd-x');
  const refArrow = document.getElementById('wg-gnd-ref');
  const refText = document.getElementById('wg-gnd-reftext');

  let connected = true;
  let counter = 3;
  const GARBLE = ['ÿ', '¿', '§', 'Ã', '?', '¨', '¤', '½', '¾', 'Ã', '€', '†'];

  function garble(text) {
    let out = '';
    for (const ch of text) {
      out += (Math.random() < 0.45)
        ? GARBLE[Math.floor(Math.random() * GARBLE.length)]
        : (Math.random() < 0.5 ? ch : '');
    }
    return out;
  }

  function setConnected(v) {
    connected = v;
    bridge.setAttribute('opacity', v ? '1' : '0');
    xmark.setAttribute('opacity', v ? '0' : '1');
    refArrow.setAttribute('stroke', v ? '#4a5b66' : '#e74c3c');
    refText.textContent = v ? '以自家 GND 为参照量电压' : '❌ 没有共同的零！电压成鬼话';
    refText.setAttribute('fill', v ? '#4a5b66' : '#e74c3c');
    btn.textContent = v ? '🔌 断开 GND' : '🔗 接回 GND';
    btn.classList.toggle('off', !v);
    screen.classList.toggle('garbled', !v);
    if (v) screen.textContent = 'GND 已接回，通信恢复正常…';
  }

  btn.onclick = () => setConnected(!connected);

  // 每 1.2s 模拟一次收包
  setInterval(() => {
    counter++;
    const line = `Hello from ESP32 #${counter}`;
    const shown = connected ? line : garble(line) + (Math.random() < 0.4 ? garble('##') : '');
    const lines = screen.textContent.split('\n').slice(-3);
    lines.push(shown);
    screen.textContent = lines.slice(-4).join('\n');
    screen.scrollTop = screen.scrollHeight;
  }, 1200);
})();
</script>
