<!-- 组件：ADC 采样与分压交互 · 用于第 4 课 -->
<div class="wgt wgt-adc" id="wg-adc">
  <div class="wgt-head"><span>🎛️ 交互演示：旋钮 → 电压 → 数字 → 亮度</span><span class="wgt-badge">拖动旋钮（滑杆）</span></div>
  <div class="wgt-body">
    <div class="wg-adc-grid">
      <!-- 左：电位器接线与电压 -->
      <div class="wg-adc-pot">
        <svg viewBox="0 0 240 230" style="width:100%;height:auto;display:block" id="wg-adc-svg">
          <!-- 3.3V 轨 -->
          <line x1="30" y1="30" x2="210" y2="30" stroke="#c0392b" stroke-width="3"/>
          <text x="30" y="22" fill="#c0392b" font-size="13" font-weight="bold">3.3V</text>
          <!-- GND 轨 -->
          <line x1="30" y1="200" x2="210" y2="200" stroke="#4a5b66" stroke-width="3"/>
          <text x="30" y="220" fill="#4a5b66" font-size="13" font-weight="bold">GND</text>
          <!-- 电阻体 -->
          <rect x="95" y="45" width="50" height="140" rx="6" fill="#e8dcc8" stroke="#b0a48c" stroke-width="3"/>
          <text x="120" y="120" fill="#8a8378" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(90 120 116)">10kΩ</text>
          <!-- 上下引线 -->
          <line x1="120" y1="30" x2="120" y2="45" stroke="#c0392b" stroke-width="3"/>
          <line x1="120" y1="185" x2="120" y2="200" stroke="#4a5b66" stroke-width="3"/>
          <!-- 滑动触点（随 slider 移动） -->
          <g id="wg-adc-wiper">
            <line x1="70" y1="115" x2="120" y2="115" stroke="#0b6e4f" stroke-width="4"/>
            <polygon points="120,108 134,115 120,122" fill="#0b6e4f"/>
            <!-- 输出线 -->
            <path d="M70 115 L45 115 L45 160 L200 160" stroke="#0b6e4f" stroke-width="3" fill="none"/>
            <text x="205" y="164" fill="#0b6e4f" font-size="12" font-weight="bold" text-anchor="end" dy="4">→ GPIO34</text>
          </g>
          <!-- 电压读数 -->
          <text id="wg-adc-vlabel" x="185" y="105" fill="#c0392b" font-size="15" font-weight="bold" text-anchor="end">1.65V</text>
        </svg>
      </div>
      <!-- 右：换算链 -->
      <div class="wg-adc-chain">
        <label style="font-size:.95em;color:#333">旋钮位置 = <b id="wg-adc-pos">50</b>%
          <input type="range" id="wg-adc-slider" min="0" max="100" step="1" value="50">
        </label>
        <div class="wg-adc-steps">
          <div class="wg-adc-step"><span>① 分压电压</span><b id="wg-adc-v">1.65</b>V</div>
          <div class="wg-adc-step"><span>② analogRead()</span><b id="wg-adc-raw">2048</b></div>
          <div class="wg-adc-step"><span>③ map() → 亮度</span><b id="wg-adc-bri">127</b>/255</div>
          <div class="wg-adc-step wg-adc-ledrow">
            <span>④ LED</span>
            <div id="wg-adc-led" class="wg-adc-led"></div>
          </div>
        </div>
        <div class="wg-adc-formula">V = 读数 ÷ 4095 × 3.3V　｜　亮度 = map(读数, 0, 4095, 0, 255)</div>
      </div>
    </div>
    <p class="wgt-hint" style="text-align:center">四步流水线：<b>机械位置 → 分压电压 → 12 位数字 → 8 位亮度</b>。每一步都是上一步的确定函数——这就是"传感"的本质。注意 ①② 只在两端有轻微非线性，入门先接受理想值。</p>
  </div>
</div>
<style>
.wg-adc-grid { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: center; }
.wg-adc-chain label { display: block; }
#wg-adc-slider { width: 100%; margin-top: 6px; accent-color: #0b6e4f; }
.wg-adc-chain b { color: #0b6e4f; font-size: 1.05em; }
.wg-adc-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.wg-adc-step { background: #f4f7f5; border: 1px solid var(--border); border-radius: 8px; padding: .5em .7em; font-size: .88em; }
.wg-adc-step span { display: block; color: #6b6b6b; font-size: .85em; }
.wg-adc-step b { color: #c0392b; font-size: 1.25em; }
.wg-adc-ledrow { display: flex; align-items: center; justify-content: space-between; }
.wg-adc-led { width: 42px; height: 42px; border-radius: 50%; background: #e8e4dc; border: 3px solid #c8c2b6; }
.wg-adc-formula { margin-top: 10px; font-size: .8em; color: #6b6b6b; font-family: Consolas, monospace; text-align: center; }
.wgt-adc .wgt-badge { font-weight: 400; font-size: .8em; color: var(--muted); }
@media (max-width: 560px) { .wg-adc-grid { grid-template-columns: 1fr; } }
</style>
<script>
(function () {
  const root = document.getElementById('wg-adc');
  if (!root || root.dataset.bound) return; root.dataset.bound = '1';
  const slider = document.getElementById('wg-adc-slider');
  const pos = document.getElementById('wg-adc-pos');
  const vLabel = document.getElementById('wg-adc-vlabel');
  const vEl = document.getElementById('wg-adc-v');
  const rawEl = document.getElementById('wg-adc-raw');
  const briEl = document.getElementById('wg-adc-bri');
  const led = document.getElementById('wg-adc-led');
  const wiper = document.getElementById('wg-adc-wiper');

  function update() {
    const p = parseInt(slider.value, 10);        // 0-100
    const v = 3.3 * p / 100;
    const raw = Math.round(4095 * p / 100);
    const bri = Math.round(255 * p / 100);
    pos.textContent = p;
    vEl.textContent = v.toFixed(2);
    rawEl.textContent = raw;
    briEl.textContent = bri;
    vLabel.textContent = v.toFixed(2) + 'V';
    // 触点上下移动：y 从 45(顶,3.3V) 到 185(底,GND)
    const wy = 45 + (185 - 45) * (1 - p / 100);
    wiper.setAttribute('transform', `translate(0 ${wy - 115})`);
    // LED
    const g = Math.pow(p / 100, 0.45);
    if (p === 0) {
      led.style.background = '#e8e4dc'; led.style.boxShadow = 'none'; led.style.borderColor = '#c8c2b6';
    } else {
      led.style.background = 'radial-gradient(circle at 35% 35%, #fff8d6, #ffd24d 60%, #e6a700)';
      led.style.boxShadow = `0 0 ${4 + 26 * g}px rgba(255,210,77,${0.25 + 0.65 * g})`;
      led.style.borderColor = '#e6a700';
    }
  }
  slider.oninput = update;
  update();
})();
</script>
